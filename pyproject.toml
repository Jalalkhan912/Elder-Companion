[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice companion for elderly parents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "livekit-agents>=1.2",
    "livekit-api>=1.2.2",
    "livekit-plugins-silero>=1.8.10",
    "pydantic[email]>=2",
    "python-dotenv>=1.2.4",
    "resend>=2.50.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
voice-agent = "voice_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs real LiveKit/LLM credentials"]
addopts = "-m 'not slow'"
