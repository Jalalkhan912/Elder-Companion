<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siri Orb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:#C9CDD8}a:hover{color:#FFFFFF}
.so-halo{position:absolute;inset:-34px;border-radius:50%;pointer-events:none;filter:blur(30px);
  background:conic-gradient(from 0deg,#2E6BFF,#A23BFF,#FF3D7F,#00D1FF,#2E6BFF);
  animation:so-rot 10s linear infinite;transition:opacity .5s ease,transform .12s linear}
.so-clip{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#0A0B1C;
  box-shadow:inset 0 0 40px rgba(255,255,255,.12)}
.so-orbit{position:absolute;inset:0;animation:so-rot 9s linear infinite}
.so-blob{position:absolute;width:72%;height:72%;border-radius:50%;filter:blur(22px);mix-blend-mode:screen;
  transition:transform .12s linear,opacity .6s ease}
.o1 .so-blob{left:-6%;top:4%;background:radial-gradient(circle,#2E6BFF 0%,rgba(46,107,255,0) 70%)}
.o2{animation-duration:12s;animation-direction:reverse}
.o2 .so-blob{left:32%;top:-4%;background:radial-gradient(circle,#B03BFF 0%,rgba(176,59,255,0) 70%)}
.o3{animation-duration:7s}
.o3 .so-blob{left:30%;top:36%;background:radial-gradient(circle,#FF3D7F 0%,rgba(255,61,127,0) 70%)}
.o4{animation-duration:15s;animation-direction:reverse}
.o4 .so-blob{left:0%;top:38%;background:radial-gradient(circle,#00D1FF 0%,rgba(0,209,255,0) 70%)}
.so-core{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(6,7,18,.62) 30%,rgba(6,7,18,0) 72%)}
.so-ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent;border-top-color:#FFFFFF;border-right-color:rgba(255,255,255,.35);
  opacity:0;pointer-events:none;animation:so-rot 1.1s linear infinite}
@keyframes so-rot{to{transform:rotate(360deg)}}
@keyframes so-breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}
@keyframes so-pulse{from{opacity:.55}to{opacity:1}}
.so-wrap{animation:so-breathe 5s ease-in-out infinite}
.st-idle .so-orbit{animation-duration:22s}
.st-idle .so-blob{opacity:.6}
.st-connecting .so-ring{opacity:1}
.st-connecting .so-orbit{animation-duration:3s}
.st-thinking .so-orbit{animation-duration:1.7s}
.st-thinking .so-clip{animation:so-pulse .8s ease-in-out infinite alternate}
.st-listening .so-wrap,.st-speaking .so-wrap,.st-thinking .so-wrap{animation:none}
.so-btn:focus-visible,.so-chip:focus-visible,a:focus-visible{outline:6px solid #FFFFFF;outline-offset:8px}
.so-chip:focus-visible{outline-color:#000000;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.so-orbit,.so-halo,.so-wrap,.so-clip,.so-ring{animation:none !important}}
</style>
</helmet>
<div class="st-{{st}}" style="width: 390px; height: 994px; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; background: #E9E6DF; color: #141414">
  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #05060B; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px">
    <div class="so-wrap" style="position: relative; width: 270px; height: 270px">
      <span class="so-halo" aria-hidden="true" style="opacity: {{haloOp}}; transform: scale({{haloScale}})"></span>
      <button class="so-btn" type="button" onClick="{{press}}" style="position: absolute; inset: 0; width: 270px; height: 270px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-family: inherit; color: #FFFFFF">
        <span class="so-clip" aria-hidden="true">
          <span class="so-orbit o1"><span class="so-blob" style="transform: scale({{b1}})"></span></span>
          <span class="so-orbit o2"><span class="so-blob" style="transform: scale({{b2}})"></span></span>
          <span class="so-orbit o3"><span class="so-blob" style="transform: scale({{b3}})"></span></span>
          <span class="so-orbit o4"><span class="so-blob" style="transform: scale({{b4}})"></span></span>
          <span class="so-core"></span>
        </span>
        <span style="position: relative; display: block; padding: 0 40px; font-size: 34px; font-weight: 700; line-height: 1.15; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75)">{{btnLabel}}</span>
      </button>
      <span class="so-ring" aria-hidden="true"></span>
    </div>
    <p role="status" aria-live="polite" style="margin: 0; min-height: 84px; padding: 0 24px; text-align: center; font-size: 32px; font-weight: 700; line-height: 1.3; color: {{statusColor}}">{{status}}</p>
    <a href="#settings" style="position: absolute; right: 24px; bottom: 28px; font-size: 20px">settings</a>
  </div>
  <div style="height: 150px; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #D3CEC4">
    <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A4640">Preview a state · or tap the orb</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button class="so-chip" type="button" onClick="{{c.pick}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #1F1D1A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agentName":{"editor":"text","default":"Sam"},"$preview":{"width":390,"height":994}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: 'idle', forced: null, lvl: 0 };
    this.lv = 0;
  }
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => this.tick(), 50);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.to); }
  cur() { return this.state.forced || this.state.st; }
  tick() {
    const st = this.cur();
    let target = 0;
    if (st === 'listening' || st === 'speaking') {
      const t = (Date.now() - this.t0) / 1000;
      const words = Math.max(0, Math.sin(t * 1.7) + 0.35);
      const syl = Math.abs(Math.sin(t * 9.1)) * 0.7 + Math.random() * 0.3;
      target = Math.min(1, words * syl * (st === 'speaking' ? 1 : 0.8));
    }
    this.lv += (target - this.lv) * (target > this.lv ? 0.35 : 0.12);
    if (this.lv < 0.004) this.lv = 0;
    if (Math.abs(this.lv - this.state.lvl) > 0.004 || (this.lv === 0 && this.state.lvl !== 0)) this.setState({ lvl: this.lv });
  }
  go(st, ms, next) {
    clearTimeout(this.to);
    this.setState({ st: st });
    if (next) this.to = setTimeout(next, ms);
  }
  demo() {
    this.go('listening', 4200, () => this.go('thinking', 1800, () => this.go('speaking', 5200, () => this.demo())));
  }
  press() {
    if (this.cur() === 'idle') {
      this.setState({ forced: null });
      this.go('connecting', 1800, () => this.demo());
    } else {
      clearTimeout(this.to);
      this.setState({ forced: null, st: 'idle' });
    }
  }
  renderVals() {
    const st = this.cur();
    const name = this.props.agentName ?? 'Sam';
    const live = st === 'listening' || st === 'thinking' || st === 'speaking';
    const l = this.state.lvl;
    const status = { idle: 'Tap the circle to talk', connecting: 'Connecting…', listening: name + ' is listening', thinking: 'One moment…', speaking: name + ' is speaking' }[st];
    const base = { idle: 0.85, connecting: 0.8, listening: 0.85, thinking: 0.6, speaking: 0.9 }[st];
    const gain = st === 'speaking' ? 0.75 : st === 'listening' ? 0.55 : 0;
    const b = (k) => (base + l * gain * k).toFixed(3);
    const chips = ['idle', 'connecting', 'listening', 'thinking', 'speaking'].map((k) => ({
      label: k[0].toUpperCase() + k.slice(1),
      bg: k === st ? '#1F1D1A' : '#FFFFFF',
      fg: k === st ? '#FFFFFF' : '#1F1D1A',
      pick: () => { clearTimeout(this.to); this.setState({ forced: k }); }
    }));
    return {
      st: st,
      status: status,
      statusColor: st === 'idle' ? '#B9BDC9' : '#FFFFFF',
      btnLabel: live ? 'Tap to end' : 'Talk to ' + name,
      b1: b(1), b2: b(0.7), b3: b(1.2), b4: b(0.85),
      haloOp: ({ idle: 0.35, connecting: 0.55, listening: 0.5 + l * 0.5, thinking: 0.7, speaking: 0.6 + l * 0.4 }[st]).toFixed(3),
      haloScale: (0.95 + l * 0.2).toFixed(3),
      chips: chips,
      press: () => this.press()
    };
  }
}
</script>
</body>
</html>
