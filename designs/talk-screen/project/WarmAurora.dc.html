<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warm Aurora</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000000}
.au-stage{position:relative;width:360px;height:360px;display:flex;align-items:center;justify-content:center}
.au-scale{position:absolute;inset:0;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.au-aura{position:absolute;inset:22px;overflow:hidden;filter:blur(20px) saturate(1.15);
  animation:au-morph 10s ease-in-out infinite,au-rot 26s linear infinite}
.au-glow{position:absolute;width:75%;height:75%;border-radius:50%;mix-blend-mode:multiply}
.g1{left:-5%;top:0;background:radial-gradient(circle,#BC82F3 0%,rgba(188,130,243,0) 70%);animation:au-drift1 9s ease-in-out infinite}
.g2{right:-8%;top:8%;background:radial-gradient(circle,#FF6778 0%,rgba(255,103,120,0) 70%);animation:au-drift2 11s ease-in-out infinite}
.g3{left:18%;bottom:-10%;background:radial-gradient(circle,#FFBA71 0%,rgba(255,186,113,0) 70%);animation:au-drift1 13s ease-in-out infinite reverse}
.g4{left:30%;top:22%;width:55%;height:55%;background:radial-gradient(circle,#8D9FFF 0%,rgba(141,159,255,0) 70%);animation:au-drift2 8s ease-in-out infinite reverse}
@keyframes au-morph{
  0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}
  33%{border-radius:61% 39% 45% 55% / 55% 62% 38% 45%}
  66%{border-radius:38% 62% 56% 44% / 62% 38% 62% 38%}}
@keyframes au-rot{to{transform:rotate(360deg)}}
@keyframes au-drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18%,12%) scale(1.15)}}
@keyframes au-drift2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-16%,14%) scale(.9)}}
@keyframes au-hue{from{filter:blur(20px) saturate(1.3) hue-rotate(0deg)}to{filter:blur(20px) saturate(1.3) hue-rotate(40deg)}}
.st-idle .au-aura{animation-duration:16s,48s;opacity:.8}
.st-thinking .au-aura{animation:au-morph 3s ease-in-out infinite,au-rot 5s linear infinite,au-hue 1.6s ease-in-out infinite alternate}
.au-rip{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;
  border:2px solid #8D9FFF;opacity:0;pointer-events:none}
@keyframes au-out{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
@keyframes au-in{from{transform:scale(1.7);opacity:0}to{transform:scale(1.02);opacity:.6}}
.st-speaking .au-rip{border-color:#FF6778;animation:au-out 2.4s cubic-bezier(.22,.61,.36,1) infinite}
.st-listening .au-rip{animation:au-in 2.4s cubic-bezier(.55,.06,.68,.19) infinite}
.au-rip.r2{animation-delay:-.8s !important}
.au-rip.r3{animation-delay:-1.6s !important}
.au-ring{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;opacity:0;pointer-events:none;
  background:conic-gradient(from 0deg,#BC82F3,#F5B9EA,#8D9FFF,#FF6778,#FFBA71,#C686FF,#BC82F3);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  transition:opacity .4s ease;animation:au-rot 1.4s linear infinite}
.au-ring.bloom{filter:blur(10px)}
.st-connecting .au-ring{opacity:1}
.au-btn{transition:background-color .45s ease,box-shadow .45s ease,transform .18s cubic-bezier(.34,1.56,.64,1);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.au-btn:active{transform:scale(.95) !important}
.au-pop{animation:au-pop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes au-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.au-shimmer{background:linear-gradient(90deg,#1C1C1E 0%,#1C1C1E 38%,#9B5DE5 46%,#E0475B 50%,#C9721F 54%,#1C1C1E 62%,#1C1C1E 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:au-sweep 1.8s linear infinite}
@keyframes au-sweep{from{background-position:100% 0}to{background-position:-150% 0}}
.au-btn:focus-visible,.au-chip:focus-visible,a:focus-visible{outline:4px solid #0A84FF;outline-offset:4px}
@media (prefers-reduced-motion: reduce){.au-aura,.au-glow,.au-rip,.au-ring,.au-pop,.au-shimmer{animation:none !important}.au-shimmer{color:#1C1C1E}}
</style>
</helmet>
<div class="st-{{st}}" style="width: 390px; height: 994px; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', system-ui, sans-serif; background: #E9E6DF; color: #1C1C1E">
  <div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBF7F2; display: flex; flex-direction: column">
    <div style="padding: 64px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; font-size: 18px; font-weight: 600; color: #6E6E73">{{dateLine}}</p>
        <h1 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">{{greeting}}</h1>
      </div>
      <a href="#settings" aria-label="Settings" style="flex: none; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: rgba(118, 118, 128, 0.12); color: #1C1C1E">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding-bottom: 40px">
      <div class="au-stage">
        <div class="au-scale" aria-hidden="true" style="transform: scale({{auraScale}})">
          <div class="au-aura">
            <span class="au-glow g1"></span>
            <span class="au-glow g2"></span>
            <span class="au-glow g3"></span>
            <span class="au-glow g4"></span>
          </div>
        </div>
        <span class="au-rip" aria-hidden="true"></span>
        <span class="au-rip r2" aria-hidden="true"></span>
        <span class="au-rip r3" aria-hidden="true"></span>
        <span class="au-ring bloom" aria-hidden="true"></span>
        <span class="au-ring" aria-hidden="true"></span>
        <button class="au-btn" type="button" onClick="{{press}}" aria-label="{{btnAria}}" style="position: relative; width: 216px; height: 216px; border-radius: 50%; cursor: pointer; font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid {{btnBorder}}; background: {{btnBg}}; color: {{btnFg}}; transform: scale({{btnScale}}); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 12px 32px rgba(70, 30, 90, 0.18)">
          <sc-if value="{{live}}" hint-placeholder-val="{{ false }}">
            <span class="au-pop" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path transform="rotate(135 12 12)" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              <span style="font-size: 32px; font-weight: 700">End</span>
            </span>
          </sc-if>
          <sc-if value="{{notLive}}" hint-placeholder-val="{{ true }}">
            <span class="au-pop" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 20px">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
              <span style="font-size: 28px; font-weight: 700; line-height: 1.15">{{btnLabel}}</span>
            </span>
          </sc-if>
        </button>
      </div>
      <div style="min-height: 80px; display: flex; align-items: flex-start; justify-content: center">
        <sc-if value="{{thinking}}" hint-placeholder-val="{{ false }}">
          <p class="au-shimmer" role="status" aria-live="polite" style="margin: 0; padding: 0 24px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">One moment…</p>
        </sc-if>
        <sc-if value="{{notThinking}}" hint-placeholder-val="{{ true }}">
          <p role="status" aria-live="polite" style="margin: 0; padding: 0 24px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; color: {{statusColor}}">{{status}}</p>
        </sc-if>
      </div>
    </div>
  </div>
  <div style="height: 150px; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #D3CEC4">
    <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A4640">Preview a state · or tap the big button</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button class="au-chip" type="button" onClick="{{c.pick}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #1F1D1A; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agentName":{"editor":"text","default":"Sam"},"$preview":{"width":390,"height":994}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { st: 'idle', forced: null, lvl: 0 };
    this.lv = 0;
  }
  componentDidMount() {
    this.t0 = Date.now();
    this.iv = setInterval(() => this.tick(), 50);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.to); }
  cur() { return this.state.forced || this.state.st; }
  tick() {
    const st = this.cur();
    let target = 0;
    if (st === 'listening' || st === 'speaking') {
      const t = (Date.now() - this.t0) / 1000;
      const words = Math.max(0, Math.sin(t * 1.7) + 0.35);
      const syl = Math.abs(Math.sin(t * 9.1)) * 0.7 + Math.random() * 0.3;
      target = Math.min(1, words * syl * (st === 'speaking' ? 1 : 0.8));
    }
    this.lv += (target - this.lv) * (target > this.lv ? 0.35 : 0.12);
    if (this.lv < 0.004) this.lv = 0;
    if (Math.abs(this.lv - this.state.lvl) > 0.004 || (this.lv === 0 && this.state.lvl !== 0)) this.setState({ lvl: this.lv });
  }
  go(st, ms, next) {
    clearTimeout(this.to);
    this.setState({ st: st });
    if (next) this.to = setTimeout(next, ms);
  }
  demo() {
    this.go('listening', 4200, () => this.go('thinking', 1800, () => this.go('speaking', 5200, () => this.demo())));
  }
  press() {
    if (this.cur() === 'idle') {
      this.setState({ forced: null });
      this.go('connecting', 1800, () => this.demo());
    } else {
      clearTimeout(this.to);
      this.setState({ forced: null, st: 'idle' });
    }
  }
  renderVals() {
    const st = this.cur();
    const name = this.props.agentName ?? 'Sam';
    const live = st === 'listening' || st === 'thinking' || st === 'speaking';
    const l = this.state.lvl;
    const now = new Date();
    const h = now.getHours();
    const status = { idle: 'Tap to talk', connecting: 'Connecting…', listening: name + ' is listening', thinking: 'One moment…', speaking: name + ' is speaking' }[st];
    const chips = ['idle', 'connecting', 'listening', 'thinking', 'speaking'].map((k) => ({
      label: k[0].toUpperCase() + k.slice(1),
      bg: k === st ? '#1F1D1A' : '#FFFFFF',
      fg: k === st ? '#FFFFFF' : '#1F1D1A',
      pick: () => { clearTimeout(this.to); this.setState({ forced: k }); }
    }));
    return {
      st: st,
      live: live,
      notLive: !live,
      thinking: st === 'thinking',
      notThinking: st !== 'thinking',
      status: status,
      statusColor: st === 'idle' ? '#6E6E73' : '#1C1C1E',
      greeting: h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening',
      dateLine: now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }),
      btnLabel: 'Talk to ' + name,
      btnAria: live ? 'End the call' : 'Talk to ' + name,
      btnBg: live ? '#E5342A' : 'rgba(255, 255, 255, 0.62)',
      btnFg: live ? '#FFFFFF' : '#1C1C1E',
      btnBorder: live ? 'rgba(255, 255, 255, 0.35)' : 'rgba(255, 255, 255, 0.85)',
      btnScale: (1 + l * 0.04).toFixed(3),
      auraScale: ({ idle: 0.9, connecting: 0.94, thinking: 0.88 }[st] || (0.95 + l * (st === 'speaking' ? 0.24 : 0.16))).toFixed(3),
      chips: chips,
      press: () => this.press()
    };
  }
}
</script>
</body>
</html>
